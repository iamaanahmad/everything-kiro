# permissions.yaml — annotated reference
#
# WHERE IT GOES
#   User scope (all workspaces):  ~/.kiro/settings/permissions.yaml
#   Workspace scope (one project): ~/.kiro/workspace-roots/<hash>/permissions.yaml
#
# There is no in-repo permissions file. Kiro stores workspace rules per user,
# outside the repository, so a cloned repo cannot grant itself permissions.
# The easiest way to create workspace rules is to choose "Always allow" /
# "Always deny" in an approval prompt and pick "This workspace".
# Kiro also hard-denies agent writes to ~/.kiro/settings/ and
# ~/.kiro/workspace-roots/, so copy this file yourself.
#
# HOW RULES ARE EVALUATED
#   deny > ask > allow > evaluate. The most restrictive matching effect wins,
#   regardless of scope. `evaluate` is added only by the approve-for-me preset.
#   Creating this file adds to Kiro's built-in defaults; it does not replace them.
#   Writes to .git/**, .vscode/**, and the .kiro agents, hooks, workflows, and
#   powers directories always ask, whatever you allow here.
#
# PATTERNS
#   fs_read / fs_write: `*` stays within one path component, `**` crosses
#     directories, {a,b} and [abc] work.
#   shell / web / mcp: only `*` is supported (no `**`, `?`, or classes).
#   Shell commands are split on ; && || | before matching and each part is
#   checked on its own, so a rule cannot match a pipe such as `curl x | sh`.
#   Deny the pieces (`curl *`, `sh *`) if you need to block that.
#
# Docs: https://kiro.dev/docs/permissions/

rules:
  # ---- DENY: always wins ------------------------------------------------

  # Never let the agent write secrets or key material
  - capability: fs_write
    match:
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
    effect: deny

  # Optionally keep secrets out of the agent's context entirely
  - capability: fs_read
    match:
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "secrets/**"
    effect: deny

  # Destructive or privileged shell commands
  - capability: shell
    match:
      - "rm -rf *"
      - "sudo *"
      - "chmod 777 *"
    effect: deny

  # ---- ALLOW: pre-approve routine work ----------------------------------

  - capability: fs_read
    effect: allow

  - capability: fs_write
    match:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
    effect: allow

  # Common dev tooling, with one exception
  - capability: shell
    match:
      - "git *"
      - "npm *"
      - "npx *"
      - "node *"
      - "python *"
      - "uv *"
    exclude:
      - "npm publish*"
      - "git push*"
    effect: allow

  - capability: web_search
    effect: allow

  - capability: web_fetch
    effect: allow

  # All tools from one trusted MCP server, minus a dangerous one
  # - capability: mcp
  #   match: ["my-db-server/*"]
  #   exclude: ["my-db-server/drop-table"]
  #   effect: allow

  # ---- ASK: anything not matched above prompts by default ---------------

  # Optional: let Kiro judge actions no rule covers (IDE 1.4.154+, needs the
  # trust classifier). Your deny/ask/allow rules above still decide first.
  # policies:
  #   - approve-for-me
